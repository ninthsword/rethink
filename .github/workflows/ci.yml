name: CI

on:
    workflow_call:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Node ${{ matrix.node-version }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 24]

        steps:
            - name: Checkout source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Check formatting and lint
              run: npm run check

            - name: Type check
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test

    workflow-lint:
        name: Workflow lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download and verify linters
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/shellcheck"
                  curl --fail --location --retry 3 --silent --show-error \
                      --output "$RUNNER_TEMP/actionlint.tar.gz" \
                      "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
                  echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
                  tar --extract --gzip --file "$RUNNER_TEMP/actionlint.tar.gz" --directory "$RUNNER_TEMP/actionlint" actionlint
                  curl --fail --location --retry 3 --silent --show-error \
                      --output "$RUNNER_TEMP/shellcheck.tar.gz" \
                      "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz"
                  echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check
                  tar --extract --gzip --file "$RUNNER_TEMP/shellcheck.tar.gz" --directory "$RUNNER_TEMP/shellcheck"

            - name: Lint workflows and shell script
              shell: bash
              run: |
                  set -euo pipefail
                  shellcheck_dir="$RUNNER_TEMP/shellcheck/shellcheck-v0.11.0"
                  PATH="$shellcheck_dir:$PATH" "$RUNNER_TEMP/actionlint/actionlint"
                  "$shellcheck_dir/shellcheck" scripts/deploy.sh

    image-scan:
        name: Scan amd64 image
        needs: checks
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Build local amd64 image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: rethink-ci:${{ github.sha }}

            - name: Scan image for vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: rethink-ci:${{ github.sha }}
                  version: v0.74.0
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'
