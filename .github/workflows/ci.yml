name: CI

on:
    workflow_call:
    push:
        branches:
            - master
    pull_request:
    schedule:
        - cron: '17 4 * * 1'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Node ${{ matrix.node-version }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]

        steps:
            - name: Checkout source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: npm ci

            - name: Check formatting and lint
              run: npm run check

            - name: Check Python
              run: |
                  python --version
                  npm run typecheck:python
                  python -B -m unittest discover -s tests/security -p test_filter_semgrep.py -v
                  python -B -m unittest discover -s tests/scripts -p test_deploy_status.py -v

            - name: Check simulator syntax
              run: |
                  g++ --version
                  npm run typecheck:cpp

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test

    workflow-lint:
        name: Workflow lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download and verify linters
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/shellcheck"
                  curl --fail --location --retry 3 --silent --show-error \
                      --output "$RUNNER_TEMP/actionlint.tar.gz" \
                      "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
                  echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
                  tar --extract --gzip --file "$RUNNER_TEMP/actionlint.tar.gz" --directory "$RUNNER_TEMP/actionlint" actionlint
                  curl --fail --location --retry 3 --silent --show-error \
                      --output "$RUNNER_TEMP/shellcheck.tar.gz" \
                      "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz"
                  echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check
                  tar --extract --gzip --file "$RUNNER_TEMP/shellcheck.tar.gz" --directory "$RUNNER_TEMP/shellcheck"

            - name: Lint workflows and shell script
              shell: bash
              run: |
                  set -euo pipefail
                  shellcheck_dir="$RUNNER_TEMP/shellcheck/shellcheck-v0.11.0"
                  PATH="$shellcheck_dir:$PATH" "$RUNNER_TEMP/actionlint/actionlint"
                  "$shellcheck_dir/shellcheck" scripts/deploy.sh

    image-scan:
        name: Scan ${{ matrix.arch }} image
        needs: checks
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      platform: linux/amd64
                    - arch: arm64
                      platform: linux/arm64
                    - arch: armv7
                      platform: linux/arm/v7
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
              with:
                  platforms: arm64,arm

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Build local ${{ matrix.arch }} image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: ${{ matrix.platform }}
                  load: true
                  push: false
                  tags: rethink-ci:${{ github.sha }}-${{ matrix.arch }}

            - name: Scan image for vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: rethink-ci:${{ github.sha }}-${{ matrix.arch }}
                  version: v0.74.0
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'

            - name: Smoke test runtime and synthetic certificate
              env:
                  IMAGE: rethink-ci:${{ github.sha }}-${{ matrix.arch }}
                  PLATFORM: ${{ matrix.platform }}
              run: |
                  docker run --rm --platform "$PLATFORM" --network none --read-only \
                      --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp \
                      --entrypoint sh "$IMAGE" -ec '
                          printf "%s\n" SMOKE_NODE
                          test "$(node --version)" = v24.18.1
                          printf "%s\n" SMOKE_OPENSSL_PACKAGE
                          test "$(apk list --installed openssl | awk "{print \$1}")" = openssl-3.5.8-r0
                          printf "%s\n" SMOKE_CONFIG_IMPORT
                          node --input-type=module -e "await import(\"./dist/util/config.js\")"
                          printf "%s\n" SMOKE_CERTIFICATE
                          openssl req -x509 -newkey rsa:2048 -nodes \
                              -keyout /tmp/fixture.key -out /tmp/fixture.crt -days 1 \
                              -subj /CN=fixture.invalid >/tmp/cert.log 2>&1
                          test -s /tmp/fixture.crt
                          printf "%s\n" SMOKE_COMPLETE
                      '
