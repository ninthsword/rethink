name: Management UI

on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

concurrency:
    group: management-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    ui-browser:
        name: Management UI browser
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run management UI browser check
              env:
                  MANAGEMENT_SCREENSHOT_DIR: ${{ runner.temp }}/management-ui
              run: npm run test:ui-browser

            - name: Upload screenshots and accessibility results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: management-ui-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/management-ui
                  retention-days: 7
                  if-no-files-found: warn
