<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n>Management sign in</title><link rel="stylesheet" href="/__management/ui.css"><link rel="stylesheet" href="/__management/login.css"></head>
<body><header><h1 data-i18n>Management sign in</h1><nav aria-label="Management navigation" data-i18n-aria-label><label><span data-i18n>Language</span><select id="language" aria-label="Language" data-i18n-aria-label><option value="en">English</option><option value="ko">한국어</option></select></label></nav></header>
<main><section><p data-i18n>Your session lasts 10 minutes. Only explicit extension renews it.</p><form id="login-form"><label for="username" data-i18n>Username</label><input id="username" name="username" autocomplete="username" value="admin" required maxlength="64"><label for="password" data-i18n>Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><p id="login-error" role="alert"></p><button id="sign-in" type="submit" data-i18n>Sign in</button></form></section></main>
<script src="/__management/ui.js"></script><script src="/__management/login.js"></script></body></html>
